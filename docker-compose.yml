# Sobe o projeto inteiro: docker compose up --build
# Variaveis lidas do arquivo .env na raiz (copie de .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bd_authentication_boleto}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-bd_authentication_boleto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ab-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
    ports:
      - "5672:5672"    # AMQP (Spring Boot)
      - "15672:15672"  # Painel web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ab-mailpit
    ports:
      - "8025:8025"  # Caixa de e-mail falsa (painel web)
    restart: unless-stopped

  auth-service:
    build: ./backend-authentication-boleto
    container_name: ab-auth-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bd_authentication_boleto}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  batch-service:
    build: ./backend-boleto-batch-service
    container_name: ab-batch-service
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BOLETO_SERVICE_URL: http://auth-service:8080/api/boleto
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  frontend:
    build: ./frontend-app
    container_name: ab-frontend
    restart: unless-stopped
    ports:
      - "8100:80"
    depends_on:
      - auth-service
      - batch-service

volumes:
  pgdata:
