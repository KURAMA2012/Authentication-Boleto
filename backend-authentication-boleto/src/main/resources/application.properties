server.port=8080
spring.application.name=authentication-boleto

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_authentication_boleto}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10


logging.level.root=INFO
logging.level.com.A3.projeto.Faculdade.AuthenticationBoleto=DEBUG

# JWT (ver .env.example)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200,http://localhost}

# E-mail (dev/demo: Mailpit em localhost:1025, painel em localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
app.mail.from=${MAIL_FROM:no-reply@authboleto.local}
app.mail.default-to=${MAIL_DEFAULT_TO:demo@authboleto.local}

# Rate limit (janela fixa, por IP) nas rotas publicas /api/boleto/validar, /enviar-token, /confirmar
app.rate-limit.max-requests=${RATE_LIMIT_MAX:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Tentativas erradas de token em /confirmar antes de invalidar (429)
app.token.max-tentativas=${TOKEN_MAX_TENTATIVAS:5}

# Seed demo (dados ficticios): cria o usuario demo e o torna dono das empresas sem dono
app.demo.seed-enabled=${DEMO_SEED_ENABLED:true}
app.demo.email=${DEMO_EMAIL:demo@authboleto.local}
app.demo.senha=${DEMO_PASSWORD:Demo@12345}
