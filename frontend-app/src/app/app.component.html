<ion-app>
  <ion-split-pane contentId="main-content" when="lg">

  <ion-menu contentId="main-content" side="start" menuId="main-menu">
    <ion-header translucent="true">
      <ion-toolbar color="primary">
        <div class="menu-brand"><img src="assets/logo.svg" alt="" width="34" height="34" /><span>Authentication Boleto</span></div>
      </ion-toolbar>
    </ion-header>

    <ion-content class="menu-content">
      <ion-list lines="none">
        <ion-menu-toggle [autoHide]="false">

          <ion-item routerLink="/painel" routerLinkActive="ativo" detail="false">
            <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
            <ion-label>Painel</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle [autoHide]="false">

          <ion-item routerLink="/cadastro-boleto" routerLinkActive="ativo" detail="false">
            <ion-icon name="document-text-outline" slot="start"></ion-icon>
            <ion-label>Gerar Boleto</ion-label>
          </ion-item>

          <ion-item routerLink="/boleto-validacao" routerLinkActive="ativo" detail="false">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-label>Validar Boleto</ion-label>
          </ion-item>

          <ion-item routerLink="/cadastro-empresa" routerLinkActive="ativo" detail="false">
            <ion-icon name="business-outline" slot="start"></ion-icon>
            <ion-label>Empresas</ion-label>
          </ion-item>

          <ion-item routerLink="/logs" routerLinkActive="ativo" detail="false">
            <ion-icon name="list-outline" slot="start"></ion-icon>
            <ion-label>Logs</ion-label>
          </ion-item>

        </ion-menu-toggle>
      </ion-list>
    </ion-content>

    <ion-footer class="menu-footer">
      <ion-item lines="none">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ usuarioNome }}</h2>
          <p>Empresa emissora</p>
        </ion-label>
        <ion-button slot="end" fill="clear" size="small" (click)="sair()" aria-label="Sair">
          <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-footer>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>

</ion-app>
