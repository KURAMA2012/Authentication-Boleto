<ion-header>
    <ion-toolbar color="primary">
        <ion-buttons slot="start">
            <ion-icon name="arrow-round-back" (click)="fecharModal()"></ion-icon>
        </ion-buttons>
        <ion-title (click)="fecharModal()">Chat</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content padding>
    <div class="container">
        <div *ngFor="let msg of mensagens">
            <div [class]="msg.posicao">
                <img class="user-img" [src]="msg.avatarURL" alt="" src="">
                <div class="msg-detail">
                    <div class="msg-info">
                        <p>
                            {{msg.pessoa }} - {{msg.dataHora  | date: 'dd/MM/yyyy hh:mm:ss' }}
                        </p>
                    </div>
                    <div class="msg-content">
                        <span class="triangle"></span>
                        <p class="line-breaker ">{{msg.mensagem}}</p>
                    </div>
                </div>
            </div>
            <div class="row">
                <p>
            </div>
        </div>
    </div>
</ion-content>
<ion-footer no-border>
    <div class="input-wrap">
        <ion-textarea #txtMensagem name="msg"></ion-textarea>
        <img src="assets/img/img_enviar_chamado.png" (click)="enviarMensagem()">
    </div>
</ion-footer>
