<ion-header>
    <ion-toolbar color="primary">
      <ion-buttons slot="start">
        <ion-back-button></ion-back-button>
      </ion-buttons>
      <ion-title>Suporte</ion-title>
    </ion-toolbar>
  </ion-header>
  

<ion-content>
  <ion-list no-border>
    <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
      <ion-item [routerLink]="[p.url]">
        <ion-icon slot="start" [name]="p.icon" color="primary"></ion-icon>
        <ion-label color="primary"> {{p.title}}</ion-label>
      </ion-item>
    </ion-menu-toggle>
  </ion-list>
</ion-content>
