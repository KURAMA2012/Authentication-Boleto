<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Chat</ion-title>
  </ion-toolbar>
  
  <ion-content fullscreen >
    <div class="container">
      <div *ngFor="let msg of mensagens">
        <div [class]="msg.posicao">
          <img class="user-img" [src]="msg.avatarURL" alt="" src="">
          <div class="msg-detail">
            <div class="msg-info">
              <p>
                {{msg.pessoa }} - {{msg.dataHora  | date: 'dd/MM/yyyy hh:mm:ss' }}
              </p>
            </div>
            <div class="msg-content">
              <span class="triangle"></span>
              <p class="line-breaker ">{{msg.mensagem}}</p>
            </div>
          </div>

        </div>
        <div class="row">
          <p>
        </div>
      </div>
    </div>
  </ion-content>

  <ion-footer >
    <div class="input-wrap">
      <ion-textarea   [(ngModel)]="mensagem"></ion-textarea>
      <img src="assets/img/img_enviar_chamado.png" (click)="enviarMensagem()">
    </div>
  </ion-footer>
