<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Autenticação de Boleto (2FA)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- 🌈 BARRA DE PROGRESSO -->
  <div class="progresso-container">
    <div class="texto-etapa">
      Etapa {{ indiceEtapa }} de 3 — {{ descricaoEtapa }}
    </div>
    <div class="barra-externa">
      <div class="barra-interna" [style.width.%]="progresso"></div>
    </div>
  </div>

  <!-- 🌟 ESTEIRA DE ETAPAS -->
  <div class="etapas-container">
    <div class="etapa" [class.ativa]="etapa === 'validar'">
      <ion-icon name="document-text-outline"></ion-icon>
      <span>Validar</span>
    </div>

    <div class="linha"></div>

    <div class="etapa" [class.ativa]="etapa === 'token'">
      <ion-icon name="mail-outline"></ion-icon>
      <span>Token</span>
    </div>

    <div class="linha"></div>

    <div class="etapa" [class.ativa]="etapa === 'confirmar'">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <span>Confirmar</span>
    </div>
  </div>

  <!-- 🧩 Etapa 1: VALIDAR -->
  <div *ngIf="etapa === 'validar'" class="animar">
    <ion-item>
      <ion-label position="stacked">Código de Autenticação</ion-label>
      <ion-input [(ngModel)]="codigoAutenticacao" placeholder="Digite o código"></ion-input>
    </ion-item>

    <ion-button expand="block" color="primary" (click)="validarBoleto()">
      Validar Boleto
    </ion-button>
  </div>

  <!-- 🧩 Etapa 2: ENVIAR TOKEN -->
  <div *ngIf="etapa === 'token'" class="animar">
    <ion-text color="medium">
      <p>O token foi gerado e enviado (simulado).</p>
    </ion-text>

    <ion-button expand="block" color="secondary" (click)="confirmarEtapaToken()">
      Prosseguir para Confirmação
    </ion-button>
  </div>

  <!-- 🧩 Etapa 3: CONFIRMAR TOKEN -->
  <div *ngIf="etapa === 'confirmar'" class="animar">
    <ion-item>
      <ion-label position="stacked">Token de Verificação</ion-label>
      <ion-input [(ngModel)]="tokenVerificacao" placeholder="Digite o token de 6 dígitos"></ion-input>
    </ion-item>

    <ion-button expand="block" color="success" (click)="confirmarToken()">
      Confirmar Token
    </ion-button>

    <ion-button expand="block" fill="clear" color="medium" (click)="voltarEtapa()">
      <ion-icon name="arrow-back-outline"></ion-icon>
      Voltar
    </ion-button>
  </div>

</ion-content>
