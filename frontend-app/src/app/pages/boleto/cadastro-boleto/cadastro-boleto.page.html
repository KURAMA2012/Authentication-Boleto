<ion-header translucent="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Boletos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Gerenciar Boletos</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <!-- Alternador entre "Gerar Manualmente" e "Importar CSV" -->
      <ion-segment [(ngModel)]="modo">
        <ion-segment-button value="manual">
          <ion-label>Gerar Manual</ion-label>
        </ion-segment-button>
        <ion-segment-button value="csv">
          <ion-label>Importar CSV</ion-label>
        </ion-segment-button>
      </ion-segment>

      <!-- ======= GERAR MANUALMENTE ======= -->
      <div *ngIf="modo === 'manual'" class="mt-3">
        <ion-item>
          <ion-label position="floating">Código de Barras</ion-label>
          <ion-input [(ngModel)]="boleto.codigoBarras"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Valor</ion-label>
          <ion-input type="number" [(ngModel)]="boleto.valor"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Data de Vencimento</ion-label>
          <ion-datetime display-format="DD/MM/YYYY" [(ngModel)]="boleto.vencimento"></ion-datetime>
        </ion-item>

        <ion-item>
          <ion-label position="floating">CPF/CNPJ Pagador</ion-label>
          <ion-input [(ngModel)]="boleto.cpfCnpjPagador"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Nome do Pagador</ion-label>
          <ion-input [(ngModel)]="boleto.nomePagador"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">CNPJ Beneficiário</ion-label>
          <ion-input [(ngModel)]="boleto.cnpjBeneficiario"></ion-input>
        </ion-item>

        <ion-button expand="block" color="success" (click)="gerarBoleto()">
          <ion-icon name="add-circle-outline" slot="start"></ion-icon>
          Gerar Boleto
        </ion-button>
      </div>

      <!-- ======= IMPORTAR CSV ======= -->
      <div *ngIf="modo === 'csv'" class="mt-3">
     
     
       
  <ion-button expand="block" color="primary" (click)="selecionarCsv()">
    <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
    Enviar CSV de Boletos
  </ion-button>

  <ion-spinner *ngIf="carregando" name="crescent"></ion-spinner>


        <ion-progress-bar
          *ngIf="carregando"
          type="indeterminate"
          color="medium"
          style="margin-top: 10px;"
        ></ion-progress-bar>
      </div>

      <!-- MENSAGEM FINAL -->
      <ion-text
        *ngIf="mensagem"
        [color]="erro ? 'danger' : 'success'"
        style="display: block; margin-top: 15px; text-align: center;"
      >
        {{ mensagem }}
      </ion-text>

    </ion-card-content>
  </ion-card>

</ion-content>
