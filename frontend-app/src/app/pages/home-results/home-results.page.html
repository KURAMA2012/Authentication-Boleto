<ion-content>
  <ion-header>
    <ion-toolbar>
      <ion-title class="author-photo-Home img">
        <ion-grid>
          <ion-row class="custom-spacing" *ngIf="relatorio == false">
            <span class="titulo-header">Olá, {{usuarioAutenticado.nome}}</span>
          </ion-row>
        </ion-grid>
      </ion-title>
      <ion-buttons slot="end">
        <ion-menu-button><ion-icon name="menu" class="menu"
            style="color: #000"></ion-icon></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <div class="menu-cabecalho">
    <div class="div-menu">
      <div *ngFor="let p of agrupadoresNovoServico">
        <button
          class="btn-menu"
          (click)="botoesRotaUnica(p)"
          (mouseover)="showSubMenu($event, p)"
          (mouseleave)="hideSubMenu($event, p)">
          {{p.label}}
        </button>
      </div>
    </div>
  </div>

  <div
    style="
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      position: absolute;
      z-index: 1;
    "
    *ngIf="listSubMenus.submenuVisible === true && contadorSubmenu != 1">
    <div class="box-submenu">
      <div style="text-align: center; font-weight: 700; padding: 5px 0">
        {{ btn_ativo }}
      </div>
      <div *ngFor="let submenu of listSubMenus.subMenus">
        <button
          class="btn-submenu"
          *ngIf="listSubMenus.rotaUnica == 'Não é rota única!'"
          (click)="redirecionarRota(submenu)">
          {{ submenu.label }}
        </button>
      </div>
    </div>
  </div>

  <div class="div-dashboard" *ngIf="(relatorio == false)">
    <div class="div-dados" *ngIf="titulo !== ''">
      <div
        class="dados"
        [style.backgroundColor]="item.bgColor"
        [style.borderColor]="item.borderColor"
        *ngFor="let item of lstCards">
        <ion-text
          [style.color]="item.fontColor"
          style="font-size: 17px"
          *ngIf="item.titulo !== ''">{{ item.titulo }}</ion-text>
        <ion-text
          [style.color]="item.fontColor"
          style="font-size: 15px"
          *ngIf="item.subtitulo !== ''">{{ item.subtitulo }}</ion-text>
        <div class="div-labels">
          <ion-text
            [style.color]="item.fontColor"
            style="font-size: 14px"
            *ngIf="item.label1 !== ''">{{ item.label1 }}</ion-text>
          <ion-text
            [style.color]="item.fontColor"
            style="font-size: 14px"
            *ngIf="item.label2 !== ''">{{ item.label2 }}</ion-text>
          <ion-text
            [style.color]="item.fontColor"
            style="font-size: 14px"
            *ngIf="item.label3 !== ''">{{ item.label3 }}</ion-text>
        </div>
        <ion-text
          [style.color]="item.fontColor"
          style="font-size: 14px"
          *ngIf="item.footer !== ''">{{ item.footer }}</ion-text>
      </div>
    </div>

    <div class="grafico"></div>
  </div>
</ion-content>
