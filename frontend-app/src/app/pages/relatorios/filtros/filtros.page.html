<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title slot="end">{{titulo}}</ion-title>
  </ion-toolbar>

</ion-header>

<ion-content *ngIf="urlFiltros ===null">
  <div style="height: 100%; display: flex; align-items: center; justify-content: center;">
    <ion-card>
      <ion-item>
        <ion-spinner name="circles" slot="end"></ion-spinner>
        <strong color="primary">Preparando Relatório...</strong>
      </ion-item>
    </ion-card>
  </div>
</ion-content>

<ion-content *ngIf="urlFiltros !=null">
  <div style="width:100%;height:100%;overflow:scroll !important;-webkit-overflow-scrolling:touch !important">
    <iframe  #frameFiltro [src]="urlFiltros" class="iframe" scrolling="yes" width="100%"
      height="100%" frameborder="0" allowfullscreen>
    </iframe>
  </div>
</ion-content>

<ion-button size="small" (click)="enviarRelatorioAnalise()">
  <ion-icon name="analytics"></ion-icon>
  <ion-label>Enviar para Análise</ion-label>
</ion-button>
