<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/painel"></ion-back-button><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Cadastrar empresa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ab-page ion-padding">

  <div class="ab-hero"><h2>Nova empresa</h2><p>Informe o CNPJ e o CEP para preencher os dados automaticamente.</p></div>

  <ion-card class="empresa-card">
    <ion-card-header>
      <ion-card-title>Dados da empresa</ion-card-title>
      <ion-card-subtitle>Campos preenchidos automaticamente podem ser editados.</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>

      <ion-grid class="ab-form-grid">
        <ion-row>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="CNPJ" [(ngModel)]="empresa.cnpj" mask="00.000.000/0000-00" placeholder="00.000.000/0000-00">
              <ion-button slot="end" fill="clear" size="small" color="tertiary" (click)="buscarCnpj()" [disabled]="carregandoCnpj"> <ion-spinner *ngIf="carregandoCnpj" name="dots"></ion-spinner> <span *ngIf="!carregandoCnpj">Buscar</span> </ion-button>
            </ion-input>
          </ion-col>
        </ion-row>
      </ion-grid>

      <div class="ab-section-title">Identifica&ccedil;&atilde;o</div>

      <ion-grid class="ab-form-grid">
        <ion-row>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Nome" [(ngModel)]="empresa.nome"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Nome Fantasia" [(ngModel)]="empresa.fantasia"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="E-mail" [(ngModel)]="empresa.email" type="email"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Telefone" [(ngModel)]="empresa.telefone" mask="(00) 00000-0000" placeholder="(00) 00000-0000"></ion-input>
          </ion-col>
        </ion-row>
      </ion-grid>

      <div class="ab-section-title">Endere&ccedil;o</div>

      <ion-grid class="ab-form-grid">
        <ion-row>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="CEP" [(ngModel)]="empresa.cep" mask="00000-000" placeholder="00000-000">
              <ion-button slot="end" fill="clear" size="small" color="tertiary" (click)="buscarCep()" [disabled]="carregandoCep"> <ion-spinner *ngIf="carregandoCep" name="dots"></ion-spinner> <span *ngIf="!carregandoCep">Buscar</span> </ion-button>
            </ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Logradouro" [(ngModel)]="empresa.logradouro"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Número" [(ngModel)]="empresa.numero"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Bairro" [(ngModel)]="empresa.bairro"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="Município" [(ngModel)]="empresa.municipio"></ion-input>
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-input fill="outline" labelPlacement="floating" label="UF" [(ngModel)]="empresa.uf" maxlength="2"></ion-input>
          </ion-col>
        </ion-row>
      </ion-grid>

      <div class="ab-form-actions">
      <ion-button class="btn-salvar" 
        (click)="cadastrar()" 
        [disabled]="carregandoSalvar">
        <ion-spinner *ngIf="carregandoSalvar" name="crescent"></ion-spinner>
        <span *ngIf="!carregandoSalvar">
          <ion-icon slot="start" name="save-outline"></ion-icon>
          Salvar Empresa
        </span>
      </ion-button>
      </div>

    </ion-card-content>
  </ion-card>
</ion-content>
