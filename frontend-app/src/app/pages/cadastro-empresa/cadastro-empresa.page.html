<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Cadastrar Empresa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Dados da Empresa</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="floating">CNPJ</ion-label>
        <ion-input 
          [(ngModel)]="empresa.cnpj" 
          mask="00.000.000/0000-00"
          placeholder="00.000.000/0000-00">
        </ion-input>
        <ion-button 
          slot="end" 
          color="tertiary" 
          (click)="buscarCnpj()" 
          [disabled]="carregandoCnpj">
          <ion-spinner *ngIf="carregandoCnpj" name="dots"></ion-spinner>
          <span *ngIf="!carregandoCnpj">Buscar</span>
        </ion-button>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Nome</ion-label>
        <ion-input [(ngModel)]="empresa.nome"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Nome Fantasia</ion-label>
        <ion-input [(ngModel)]="empresa.fantasia"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">E-mail</ion-label>
        <ion-input [(ngModel)]="empresa.email" type="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Telefone</ion-label>
        <ion-input 
          [(ngModel)]="empresa.telefone" 
          mask="(00) 00000-0000"
          placeholder="(00) 00000-0000">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">CEP</ion-label>
        <ion-input 
          [(ngModel)]="empresa.cep" 
          mask="00000-000"
          placeholder="00000-000">
        </ion-input>
        <ion-button 
          slot="end" 
          color="tertiary" 
          (click)="buscarCep()" 
          [disabled]="carregandoCep">
          <ion-spinner *ngIf="carregandoCep" name="dots"></ion-spinner>
          <span *ngIf="!carregandoCep">Buscar</span>
        </ion-button>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Logradouro</ion-label>
        <ion-input [(ngModel)]="empresa.logradouro"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Número</ion-label>
        <ion-input [(ngModel)]="empresa.numero"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Bairro</ion-label>
        <ion-input [(ngModel)]="empresa.bairro"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Município</ion-label>
        <ion-input [(ngModel)]="empresa.municipio"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">UF</ion-label>
        <ion-input [(ngModel)]="empresa.uf" maxlength="2"></ion-input>
      </ion-item>

      <ion-button 
        expand="block" 
        color="success" 
        (click)="cadastrar()" 
        [disabled]="carregandoSalvar">
        <ion-spinner *ngIf="carregandoSalvar" name="crescent"></ion-spinner>
        <span *ngIf="!carregandoSalvar">
          <ion-icon slot="start" name="save-outline"></ion-icon>
          Salvar Empresa
        </span>
      </ion-button>

    </ion-card-content>
  </ion-card>
</ion-content>
