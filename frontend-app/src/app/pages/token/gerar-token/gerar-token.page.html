<ion-header translucent="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Gerar Token de Verificação</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="gradient-bg">

  <div class="container">
    <ion-card class="glass-card animate__animated animate__fadeInUp">
      <ion-card-header>
        <ion-card-title>Validação de Token</ion-card-title>
        <ion-card-subtitle>Informe o código de autenticação abaixo</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="gerarToken()">
          <ion-item fill="solid" class="input-item">
            <ion-label position="floating">
              <ion-icon name="key-outline"></ion-icon>
              Código de Autenticação
            </ion-label>
            <ion-input
              [(ngModel)]="codigoAutenticacao"
              name="codigoAutenticacao"
              required
              type="text"
              placeholder="Ex: 12345-ABC"
            ></ion-input>
          </ion-item>

          <ion-button expand="block" type="submit" color="tertiary" class="btn-enviar">
            <ion-icon name="rocket-outline" slot="start"></ion-icon>
            Gerar Token
          </ion-button>
        </form>

        <div *ngIf="token" class="token-area">
          <ion-icon name="shield-checkmark-outline" color="success" size="large"></ion-icon>
          <h2 class="token-label">Token Gerado:</h2>
          <p class="token-text">{{ token }}</p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
