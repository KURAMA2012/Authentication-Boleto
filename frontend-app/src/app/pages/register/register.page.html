<ion-content class="login-container">

  <div class="login-card">

    <!-- LADO ESQUERDO (FUNDO AZUL) -->
    <div class="left-panel">
      <ion-icon name="person-add-outline" class="login-logo"></ion-icon>
      <h1 class="login-title">Criar Conta</h1>
    </div>

    <!-- LADO DIREITO - FORM -->
    <div class="right-panel">

      <h2 class="welcome-title">Bem-vindo 👋</h2>
      <p class="welcome-subtitle">Crie sua conta para usar o aplicativo</p>

      <form [formGroup]="form" (ngSubmit)="registrar()">

        <!-- Nome -->
        <div class="input-group">
          <ion-icon name="person-outline"></ion-icon>
          <ion-input formControlName="nome" placeholder="Seu nome"></ion-input>
        </div>

        <!-- Email -->
        <div class="input-group">
          <ion-icon name="mail-outline"></ion-icon>
          <ion-input formControlName="email" placeholder="E-mail"></ion-input>
        </div>

        <!-- CPF -->
        <div class="input-group">
          <ion-icon name="id-card-outline"></ion-icon>
          <ion-input formControlName="cpf" placeholder="CPF"></ion-input>
        </div>

        <!-- Telefone -->
        <div class="input-group">
          <ion-icon name="call-outline"></ion-icon>
          <ion-input formControlName="telefone" placeholder="Telefone"></ion-input>
        </div>

        <!-- Senha -->
        <div class="input-group">
          <ion-icon name="lock-closed-outline"></ion-icon>

          <ion-input 
            formControlName="senha" 
            [type]="mostrarSenha ? 'text' : 'password'"
            placeholder="Senha">
          </ion-input>

          <ion-icon 
            [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"
            (click)="toggleSenha()"
            class="toggle-password">
          </ion-icon>
        </div>

        <!-- BOTÕES LADO A LADO -->
        <div class="button-row">
          <ion-button 
            expand="block" 
            class="btn-secondary" 
            routerLink="/login">
            Entrar
          </ion-button>

          <ion-button 
            expand="block" 
            class="btn-primary" 
            type="submit">
            Cadastrar
          </ion-button>
        </div>

      </form>

    </div>

  </div>

</ion-content>
