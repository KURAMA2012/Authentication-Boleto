<ion-content class="login-container">

  <div class="login-card">

    <!-- Lado esquerdo (Boas-vindas) -->
    <div class="left-panel">
      <div class="left-content">
        <h2>Bem-vindo de volta</h2>
        <p>Acesse sua conta agora mesmo</p>
        <ion-button expand="block" color="light" class="btn-entrar" (click)="loginRapido()">
          ENTRAR
        </ion-button>
      </div>
    </div>

    <!-- Lado direito (Cadastro/Login) -->
    <div class="right-panel">
      <div class="right-content">
        <h2>Crie sua conta</h2>
        <p>Cadastre seus dados</p>

        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <ion-item class="input-item">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-input formControlName="nome" placeholder="Nome"></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-input formControlName="email" type="email" placeholder="E-mail"></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input
              formControlName="senha"
              [type]="mostrarSenha ? 'text' : 'password'"
              placeholder="Senha">
            </ion-input>
            <ion-icon
              [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"
              slot="end"
              (click)="toggleSenha()">
            </ion-icon>
          </ion-item>

          <ion-button expand="block" class="btn-cadastrar" type="submit">
            CADASTRAR
          </ion-button>
        </form>
      </div>
    </div>

  </div>
</ion-content>
